# Зоны для ограничения частоты запросов (Rate Limiting)
# 10m (10 мегабайт) достаточно для хранения ~160 000 IP-адресов в памяти.
# Ограничиваем обычные запросы к API до 10 запросов в секунду (rate=10r/s) с одного IP.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Ограничиваем количество одновременных TCP-соединений до 15 с одного IP.
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Кэширование для статических файлов фронтенда
map $sent_http_content_type $cacheable_types {
    "text/css"                  "max-age=31536000, public";
    "application/javascript"    "max-age=31536000, public";
    "image/x-icon"              "max-age=604800, public";
    ~image/                     "max-age=2592000, public";
    default                     "no-cache, no-store, must-revalidate";
}

# HTTP: перенаправление на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-bank-domain.com www.your-bank-domain.com;

    return 301 https://$host$request_uri;
}

# HTTPS: Основной сервер с SSL
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-bank-domain.com www.your-bank-domain.com;

    # SSL сертификаты (полученные через Certbot)
    ssl_certificate /etc/letsencrypt/live/your-bank-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-bank-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS (Strict Transport Security)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Сжатие Gzip (для экономии трафика и ускорения загрузки)
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.code
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Заголовки безопасности (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    # ДНС-сервер Docker для динамического разрешения имен контейнеров
    resolver 127.0.0.11 valid=30s;

    # Настройки отдачи статики фронтенда (React)
    location / {
        # Лимит на 30 одновременных подключений к фронтенду
        limit_conn conn_limit 30;

        set $upstream_frontend http://frontend:3000;
        proxy_pass $upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поддержка WebSockets (для Hot Module Replacement, если нужно)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Кэширование статических ресурсов
        add_header Cache-Control $cacheable_types;
    }

    # API Бэкенда (C# .NET)
    location /api/ {
        # Применяем лимиты: 10 запросов/сек, буфер (burst) до 20 запросов. 
        # nodelay означает, что избыточные запросы в пределах burst обрабатываются сразу, а не задерживаются.
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 15;

        set $upstream_backend http://backend:5000;
        proxy_pass $upstream_backend; # Передаем полный путь с /api/, так как контроллеры ожидают именно его
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Тайм-ауты (увеличены для долгих запросов к LLM/Ollama через Ngrok)
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;

        # Отключение буферизации для SSE/веб-сокетов, если бэкенд шлет стриминг ответов LLM
        proxy_buffering off;
        proxy_cache off;
    }

    # SignalR Хабы (WebSocket соединения)
    location /hubs/ {
        set $upstream_backend http://backend:5000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket обязательные заголовки
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Увеличенные тайм-ауты для долгоживущих WebSocket-соединений
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
        proxy_cache off;
    }

    # Кастомная обработка ошибки превышения лимитов (Too Many Requests)
    error_page 429 /429.html;
    location = /429.html {
        root /usr/share/nginx/html;
        internal;
    }
}
