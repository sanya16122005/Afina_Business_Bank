name: Unpack project archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack archive into repository root
        run: |
          shopt -s nullglob dotglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No archive to unpack"; exit 0; fi
          zip="${zips[0]}"
          mkdir -p /tmp/unpacked
          unzip -q "$zip" -d /tmp/unpacked
          git rm -q "$zip"
          cp -r /tmp/unpacked/* .
          git config user.name "Alexander Sterligov"
          git config user.email "assterligov@gmail.com"
          git add -A
          git commit -m "Add Afina Business Bank project source" \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_016LsF4oymgg7M9XW8KeYMRW"
          git push
